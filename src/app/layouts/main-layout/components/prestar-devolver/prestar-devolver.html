<h3 mat-dialog-title>Prestar / devolver herramienta</h3>

<mat-dialog-content>
  <mat-tab-group>

    <!-- ================= Pestaña Prestar ================= -->
    <mat-tab label="Prestar">
      <div class="tab-content">
        <!-- Buscador con autocomplete -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Buscar herramienta</mat-label>
          <input
            type="text"
            matInput
            [matAutocomplete]="autoPrestar"
            [ngModel]="busquedaPrestar()"
            (ngModelChange)="busquedaPrestar.set($event)"
            placeholder="Escribe el nombre de la herramienta..."
          />
          <button mat-icon-button matSuffix *ngIf="busquedaPrestar()" (click)="limpiarSeleccionPrestar()">
            <mat-icon>close</mat-icon>
          </button>
          <mat-autocomplete #autoPrestar="matAutocomplete" (optionSelected)="onSeleccionarHerramientaPrestar($event)">
            <mat-option *ngFor="let tool of disponiblesFiltrados()" [value]="tool.nombre">
              {{ tool.nombre }} - {{ tool.descripcion }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>

        <!-- Campo de solo lectura con la herramienta seleccionada -->
        <div class="campo">
          <label>Herramienta seleccionada</label>
          <input type="text" [value]="herramientaPrestarNombre" disabled placeholder="Ninguna herramienta seleccionada" />
        </div>

        <div class="campo">
          <label>Prestado a</label>
          <input
            [(ngModel)]="entidadAjena"
            (input)="validarEntidadAjena()"
            (blur)="validarEntidadAjena()"
            placeholder="Nombre o entidad"
          />
          <small class="error" *ngIf="errorEntidadAjena">{{ errorEntidadAjena }}</small>
        </div>

        <div class="campo">
          <label>Anotaciones</label>
          <textarea
            [(ngModel)]="anotacionesPrestamo"
            (input)="validarAnotacionesPrestamo()"
            (blur)="validarAnotacionesPrestamo()"
            rows="2"
            placeholder="Estado de la herramienta"
          ></textarea>
          <small class="error" *ngIf="errorAnotacionesPrestamo">{{ errorAnotacionesPrestamo }}</small>
        </div>

        <button
          class="btn-prestar"
          (click)="prestar()"
          [disabled]="
            !herramientaSeleccionadaId ||
            !entidadAjena.trim() ||
            anotacionesPrestamo.trim().length < 5
          "
        >
          Confirmar préstamo
        </button>
      </div>
    </mat-tab>

    <!-- ================= Pestaña Devolver ================= -->
    <mat-tab label="Devolver">
      <div class="tab-content">
        <!-- Buscador con autocomplete -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Buscar herramienta</mat-label>
          <input
            type="text"
            matInput
            [matAutocomplete]="autoDevolver"
            [ngModel]="busquedaDevolver()"
            (ngModelChange)="busquedaDevolver.set($event)"
            placeholder="Escribe el nombre de la herramienta..."
          />
          <button mat-icon-button matSuffix *ngIf="busquedaDevolver()" (click)="limpiarSeleccionDevolver()">
            <mat-icon>close</mat-icon>
          </button>
          <mat-autocomplete #autoDevolver="matAutocomplete" (optionSelected)="onSeleccionarHerramientaDevolver($event)">
            <mat-option *ngFor="let tool of prestadosFiltrados()" [value]="tool.nombre">
              {{ tool.nombre }} - {{ tool.descripcion }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>

        <!-- Campo de solo lectura con la herramienta seleccionada -->
        <div class="campo">
          <label>Herramienta seleccionada</label>
          <input type="text" [value]="herramientaDevolverNombre" disabled placeholder="Ninguna herramienta seleccionada" />
        </div>

        <div class="campo">
          <label>Anotaciones</label>
          <textarea
            [(ngModel)]="anotacionesDevolucion"
            (input)="validarAnotacionesDevolucion()"
            (blur)="validarAnotacionesDevolucion()"
            rows="2"
            placeholder="Cómo se devuelve, si tiene daños"
          ></textarea>
          <small class="error" *ngIf="errorAnotacionesDevolucion">{{ errorAnotacionesDevolucion }}</small>
        </div>

        <button
          class="btn-devolver"
          (click)="devolver()"
          [disabled]="!herramientaDevueltaId || anotacionesDevolucion.trim().length < 5"
        >
          Confirmar devolución
        </button>
      </div>
    </mat-tab>

  </mat-tab-group>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancelar</button>
</mat-dialog-actions>
