<div class="toolbar-secundaria">
  <div class="toolbar-acciones">
    <button class="tbtn tbtn-add" (click)="abrirAddIngreso()">
      <i class="bi bi-plus-lg"></i>
      Añadir ingreso
    </button>
  </div>

  <div class="buscador-wrapper">
    <div class="caja-buscador">
      <i class="bi bi-search"></i>
      <input
        class="buscador"
        type="text"
        placeholder="Buscar por fecha o descripción..."
        [value]="searchTerm()"
        (input)="searchTerm.set($any($event.target).value)"
      />
      <button class="btn-expandir" *ngIf="searchTerm()" (click)="clearSearch()">
        <i class="bi bi-x"></i>
      </button>
    </div>
  </div>
</div>

@if (cargando) {
  <div class="loading-state">
    <div class="spinner"></div>
    <p>Cargando Ingresos...</p>
  </div>
}

@if (errorCarga) {
  <div class="error-state">
    <p>{{ errorCarga }}</p>
    <button (click)="cargarIngresos()">Reintentar</button>
  </div>
}

@if (!cargando && !errorCarga) {
  <div class="container mt-3">
    <table class="table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Descripción</th>
          <th>Monto</th>
          <th class="text-end"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of ingresosFiltrados()">
          <td>{{ item.fechaIngreso }}</td>
          <td class="fw-semibold">{{ item.descripcion }}</td>
          <td>{{ item.monto | currency: 'EUR' }}</td>
          <td class="text-end">
            <button class="btn btn-link text-dark p-0" [matMenuTriggerFor]="menu">
              <i class="bi bi-three-dots-vertical"></i>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="eliminarIngreso(item.id, item.descripcion, item.monto)">
                <i class="bi bi-trash3-fill me-2"></i> Eliminar
              </button>
            </mat-menu>
          </td>
        </tr>

        <tr *ngIf="ingresosFiltrados().length === 0">
          <td colspan="4" class="empty-state">
            <i class="bi bi-file-earmark-spreadsheet"></i>
            <p>No se encontraron ingresos</p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
}
