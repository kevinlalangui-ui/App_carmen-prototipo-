<section id="fondo">
  <div class="header">
    <img src="header.png" alt="hero" />
  </div>

  <div class="fab-wrap">
    <div class="fab-options" [class.open]="fabAbierto">
      <div class="fab-option" (click)="openMember(); fabAbierto = false">
        <span class="fab-label">Nuevo socio</span>
        <button mat-mini-fab>
          <mat-icon>person_add</mat-icon>
        </button>
      </div>
      <div class="fab-option" (click)="openAddCurso(); fabAbierto = false">
        <span class="fab-label">Nuevo Actividad</span>
        <button mat-mini-fab>
          <mat-icon color="#6CAD6A">menu_book</mat-icon>
        </button>
      </div>
    </div>
    <button mat-fab (click)="fabAbierto = !fabAbierto">
      <mat-icon>{{ fabAbierto ? 'close' : 'add' }}</mat-icon>
    </button>
  </div>

  <div class="action-bar">
    <button class="action-bar-btn" routerLink="/main/socios" routerLinkActive="active" (click)="fabAbierto = false">
      <i class="bi bi-people"></i>
      <span>Socios</span>
    </button>
    <button class="action-bar-btn" routerLink="/main/gastos" routerLinkActive="active" (click)="fabAbierto = false">
      <i class="bi bi-credit-card"></i>
      <span>Pagos</span>
    </button>
    <button class="action-bar-btn" routerLink="/main/prestamos" routerLinkActive="active" (click)="fabAbierto = false">
      <i class="bi bi-file-earmark-text"></i>
      <span>Inventario</span>
    </button>
    <button class="action-bar-btn" routerLink="/main/cursos" routerLinkActive="active" (click)="fabAbierto = false">
      <i class="bi bi-book"></i>
      <span>Cursos</span>
    </button>
    <button class="action-bar-btn" routerLink="/main/ingresos" routerLinkActive="active" (click)="fabAbierto = false">
      <i class="bi bi-file-earmark-spreadsheet"></i>
      <span>Presupuestos</span>
    </button>
    <button class="action-bar-btn" (click)="goToRegister()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Cerrar sesión</span>
    </button>
  </div>

  <router-outlet></router-outlet>
</section>
